[package]
name = "fluxel-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Native host primitives for Fluxel applications"
repository = "https://github.com/fluxel-project/fluxel-host"
readme = "README.md"
documentation = "https://docs.rs/fluxel-host"
keywords = ["windowing", "raw-window-handle", "native", "lifecycle"]
categories = ["gui", "os"]

[package.metadata.docs.rs]
features = ["winit-runtime"]

[features]
# Event-driven native bootstrap for presentation tests and examples.  It is
# deliberately optional: the small adopted-handle types remain useful for
# applications which already own an Android Activity or UIKit view.
winit-runtime = ["dep:winit", "winit/x11"]
winit-runtime-wayland = ["dep:winit", "winit/wayland", "winit/wayland-dlopen"]

[dependencies]
raw-window-handle = "0.6.2"
winit = { version = "0.30.12", default-features = false, features = ["rwh_06", "android-native-activity"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
